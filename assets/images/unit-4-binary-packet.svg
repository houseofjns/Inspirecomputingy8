<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="t d"><title id="t">Binary place values and data packet</title><desc id="d">An eight-bit place value row and a packet divided into header and payload.</desc><rect width="960" height="380" rx="20" fill="#F7F9FC"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="43" fill="#52647A" font-size="16" font-weight="700">BINARY REPRESENTATION AND DATA PACKETS</text><text x="250" y="93" fill="#718096" font-size="12" font-weight="700">8-BIT PLACE VALUES</text><g transform="translate(45 112)"><g fill="#0A192F"><rect x="0" y="0" width="50" height="55" rx="7"/><rect x="56" y="0" width="50" height="55" rx="7"/><rect x="112" y="0" width="50" height="55" rx="7"/><rect x="168" y="0" width="50" height="55" rx="7"/><rect x="224" y="0" width="50" height="55" rx="7"/><rect x="280" y="0" width="50" height="55" rx="7"/><rect x="336" y="0" width="50" height="55" rx="7"/><rect x="392" y="0" width="50" height="55" rx="7"/></g><g fill="#F4E1A1" font-size="18" font-weight="700"><text x="25" y="35">1</text><text x="81" y="35">0</text><text x="137" y="35">1</text><text x="193" y="35">0</text><text x="249" y="35">0</text><text x="305" y="35">1</text><text x="361" y="35">0</text><text x="417" y="35">1</text></g><g fill="#63748A" font-size="10"><text x="25" y="78">128</text><text x="81" y="78">64</text><text x="137" y="78">32</text><text x="193" y="78">16</text><text x="249" y="78">8</text><text x="305" y="78">4</text><text x="361" y="78">2</text><text x="417" y="78">1</text></g></g><text x="715" y="93" fill="#718096" font-size="12" font-weight="700">DATA PACKET</text><g><rect x="570" y="112" width="160" height="100" rx="10" fill="#D7E5F2" stroke="#6A91B4" stroke-width="2"/><rect x="730" y="112" width="185" height="100" rx="10" fill="#F4E8BF" stroke="#C8A849" stroke-width="2"/><text x="650" y="151" fill="#24415F" font-size="15" font-weight="700">HEADER</text><text x="650" y="173" fill="#55718D" font-size="10">Address / control</text><text x="822" y="151" fill="#715B1B" font-size="15" font-weight="700">PAYLOAD</text><text x="822" y="173" fill="#927B35" font-size="10">Carried data</text></g><text x="480" y="322" fill="#718096" font-size="12">One byte contains eight bits. Packet headers help data reach the intended destination.</text></g></svg>
