<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="t d"><title id="t">Simple network topology</title><desc id="d">Internet connects to a router, which connects wired desktop and wireless phone and laptop devices.</desc><rect width="960" height="380" rx="20" fill="#F7FAFC"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="45" fill="#52647A" font-size="16" font-weight="700">A SIMPLE HOME NETWORK</text><g stroke="#D4AF37" stroke-width="4" fill="none" stroke-linecap="round"><path d="M480 103v53M480 156H230v50M480 156h250v50M480 156v130M230 256v-50M730 256v-50"/></g><g><rect x="395" y="65" width="170" height="65" rx="14" fill="#0A192F"/><rect x="390" y="205" width="180" height="82" rx="14" fill="#173451"/><rect x="120" y="205" width="220" height="82" rx="14" fill="#FFF" stroke="#D8C36F" stroke-width="2"/><rect x="620" y="205" width="220" height="82" rx="14" fill="#FFF" stroke="#D8C36F" stroke-width="2"/></g><g fill="#F4E2A5" font-size="15" font-weight="700"><text x="480" y="104">INTERNET</text><text x="480" y="239">ROUTER</text><text x="480" y="260" font-size="10">Routes data</text></g><g fill="#1E334B" font-size="14" font-weight="700"><text x="230" y="240">DESKTOP PC</text><text x="730" y="240">PHONE / LAPTOP</text></g><g fill="#7C8999" font-size="10"><text x="230" y="262">Ethernet cable · Wired</text><text x="730" y="262">Wi‑Fi · Wireless</text></g><text x="480" y="336" fill="#718096" font-size="12">Wired and wireless devices can share a router and internet connection.</text></g></svg>
