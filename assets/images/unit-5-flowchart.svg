<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">Sequence selection iteration flowchart</title><desc id="d">Start, input and process instructions, decision branch, and a loop returning to a condition.</desc><rect width="960" height="340" rx="20" fill="#FAF8FB"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="42" fill="#52647A" font-size="16" font-weight="700">THREE PROGRAMMING CONSTRUCTS</text><g stroke="#D4AF37" stroke-width="3" fill="none"><path d="M480 95v26M480 169v22M480 240v24M575 215h150v-80h-85M725 135v80h-150"/></g><rect x="415" y="65" width="130" height="35" rx="17" fill="#0A192F"/><text x="480" y="88" fill="#F4E2A5" font-size="12" font-weight="700">START</text><rect x="400" y="121" width="160" height="48" rx="8" fill="#DDEAF5" stroke="#6E94B5" stroke-width="2"/><text x="480" y="150" fill="#24415F" font-size="13" font-weight="700">SEQUENCE</text><polygon points="480,191 575,215 480,239 385,215" fill="#F4E8BF" stroke="#C6A244" stroke-width="2"/><text x="480" y="219" fill="#70591A" font-size="12" font-weight="700">CONDITION?</text><rect x="400" y="264" width="160" height="42" rx="8" fill="#E2F1E9" stroke="#6DA88A" stroke-width="2"/><text x="480" y="290" fill="#286549" font-size="12" font-weight="700">OUTPUT / END</text><text x="745" y="126" fill="#6A7D92" font-size="11">ITERATION</text><text x="610" y="205" fill="#6A7D92" font-size="10">repeat</text><text x="480" y="329" fill="#718096" font-size="10">Sequence runs in order · Selection chooses · Iteration repeats</text></g></svg>
