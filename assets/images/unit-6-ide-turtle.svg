<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">IDE workspace and turtle graphics</title><desc id="d">A code editor, output area and a turtle-drawn square.</desc><rect width="960" height="360" rx="20" fill="#F7FAF9"/><g font-family="Arial,sans-serif"><text x="480" y="42" text-anchor="middle" fill="#52647A" font-size="16" font-weight="700">FROM CODE TO OUTPUT</text><rect x="60" y="75" width="510" height="220" rx="12" fill="#0A192F"/><rect x="60" y="75" width="510" height="32" rx="12" fill="#203B56"/><circle cx="83" cy="91" r="5" fill="#DC8B8B"/><circle cx="101" cy="91" r="5" fill="#D7BA58"/><circle cx="119" cy="91" r="5" fill="#6FB28C"/><text x="143" y="95" font-size="10" fill="#D7E0E9">project.py · code editor</text><g font-size="13" font-family="monospace"><text x="89" y="139" fill="#D5BB62">for</text><text x="119" y="139" fill="#E7EDF3"> side in range(4):</text><text x="115" y="170" fill="#85C8B2">forward</text><text x="182" y="170" fill="#E7EDF3">(100)</text><text x="115" y="199" fill="#85C8B2">right</text><text x="163" y="199" fill="#E7EDF3">(90)</text><text x="89" y="246" fill="#899CB1"># draw a square</text></g><rect x="600" y="75" width="300" height="220" rx="12" fill="#fff" stroke="#DCE6E2" stroke-width="2"/><text x="750" y="104" text-anchor="middle" fill="#718096" font-size="11" font-weight="700">TURTLE GRAPHICS OUTPUT</text><rect x="685" y="138" width="130" height="130" fill="#F8F6E9" stroke="#D4AF37" stroke-width="4"/><path d="M750 203l0-65" stroke="#5A9A7E" stroke-width="4" stroke-linecap="round"/><path d="M742 148l8-12 8 12" fill="none" stroke="#5A9A7E" stroke-width="4" stroke-linecap="round"/><text x="480" y="329" text-anchor="middle" fill="#718096" font-size="11">Write instructions · run the program · inspect and improve the result</text></g></svg>
